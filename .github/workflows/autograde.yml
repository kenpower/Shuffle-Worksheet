name: Autograde

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build (MSBuild) and run tests
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Restore NuGet packages
      run: |
        nuget restore "Anagram-TDD.sln"
      shell: cmd

    - name: Build solution (Release|x64)
      run: |
        msbuild "Anagram-TDD.sln" /p:Configuration=Release /p:Platform=x64 /m
      shell: cmd

    - name: Run tests and collect gtest XML
      continue-on-error: true
      shell: pwsh
      run: |
        $exe = Join-Path "$PWD" "x64\Release\Anagram-TDD.exe"
        if (Test-Path $exe) {
          Write-Host "Running tests: $exe"
          & $exe --gtest_output=xml:results.xml
          $rc = $LASTEXITCODE
          Write-Host "Raw exit code: $rc"
          # If gtest didn't produce XML, create a minimal results.xml using the exit code
          if (-not (Test-Path "$PWD\results.xml")) {
            $tests = 0; $fails = 0
            if ($rc -ne 0) { $tests = 1; $fails = 1 }
            $xml = "<testsuites tests='{0}' failures='{1}'></testsuites>" -f $tests, $fails
            Set-Content -Path "$PWD\results.xml" -Value $xml
            Write-Host "Created fallback results.xml (tests=$tests failures=$fails)"
          }
        } else {
          Write-Host "Executable not found: $exe"
          $rc = 1
        }
        Write-Host "Test exit code: $rc"
        Set-Content -Path test_exit_code.txt -Value $rc

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: results.xml

    - name: Parse test results
      id: parse
      if: always()
      shell: pwsh
      run: |
        $xml = ""
        if (Test-Path results.xml) { $xml = Get-Content results.xml -Raw }
        $tests = 0; $failures = 0
        if ($xml) {
          $m = [regex]::Match($xml, '<testsuites[^>]*tests="(\d+)"[^>]*failures="(\d+)"')
          if (-not $m.Success) { $m = [regex]::Match($xml, '<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"') }
          if ($m.Success) { $tests = [int]$m.Groups[1].Value; $failures = [int]$m.Groups[2].Value }
        }
        $passed = $tests - $failures
        if ($tests -eq 0) { $color = 'lightgrey' } elseif ($passed -eq $tests) { $color = 'brightgreen' } elseif ($passed -gt 0) { $color = 'yellow' } else { $color = 'red' }
        $message = "$passed/$tests"
        Write-Host "message=$message color=$color"
        "message=$message" >> $env:GITHUB_OUTPUT
        "color=$color" >> $env:GITHUB_OUTPUT

    # Badge SVG is generated here, then committed to a separate orphan
    # 'badges' branch (see next step) - main/master history stays
    # commit-free. Works automatically in every student fork, no
    # secrets or per-repo setup needed (uses the fork's own
    # auto-provided GITHUB_TOKEN).
    - name: Generate badge SVG
      if: always()
      shell: pwsh
      run: |
        $label = "tests passed"
        $message = "${{ steps.parse.outputs.message }}"
        $color = "${{ steps.parse.outputs.color }}"
        $colors = @{ brightgreen = "#4c1"; yellow = "#dfb317"; red = "#e05d44"; lightgrey = "#9f9f9f" }
        $hex = $colors[$color]; if (-not $hex) { $hex = "#9f9f9f" }
        $labelWidth = 90; $msgWidth = 60
        $totalWidth = $labelWidth + $msgWidth
        $lines = @(
          "<svg xmlns=`"http://www.w3.org/2000/svg`" width=`"$totalWidth`" height=`"20`">",
          "  <linearGradient id=`"b`" x2=`"0`" y2=`"100%`">",
          "    <stop offset=`"0`" stop-color=`"#bbb`" stop-opacity=`".1`"/>",
          "    <stop offset=`"1`" stop-opacity=`".1`"/>",
          "  </linearGradient>",
          "  <rect rx=`"3`" width=`"$totalWidth`" height=`"20`" fill=`"#555`"/>",
          "  <rect rx=`"3`" x=`"$labelWidth`" width=`"$msgWidth`" height=`"20`" fill=`"$hex`"/>",
          "  <path fill=`"$hex`" d=`"M$labelWidth 0h4v20h-4z`"/>",
          "  <rect rx=`"3`" width=`"$totalWidth`" height=`"20`" fill=`"url(#b)`"/>",
          "  <g fill=`"#fff`" text-anchor=`"middle`" font-family=`"DejaVu Sans,Verdana,Geneva,sans-serif`" font-size=`"11`">",
          "    <text x=`"$($labelWidth/2)`" y=`"14`">$label</text>",
          "    <text x=`"$($labelWidth + $msgWidth/2)`" y=`"14`">$message</text>",
          "  </g>",
          "</svg>"
        )
        $svg = $lines -join "`n"
        Set-Content -Path badge.svg -Value $svg -NoNewline

    - name: Commit badge to orphan 'badges' branch
      if: always()
      shell: bash
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin badges 2>/dev/null || true

        if git show-ref --verify --quiet refs/remotes/origin/badges; then
          git worktree add badge-worktree badges
        else
          git worktree add --detach badge-worktree
          (cd badge-worktree && git checkout --orphan badges && git rm -rf . >/dev/null 2>&1 || true)
        fi

        cp badge.svg badge-worktree/badge.svg
        cd badge-worktree
        git add badge.svg
        if git diff --cached --quiet; then
          echo "Badge unchanged, skipping commit"
        else
          git commit -m "Update test badge [skip ci]"
          git push origin HEAD:badges || echo "Push failed (e.g. PR from fork) - continuing"
        fi
        cd ..
        git worktree remove badge-worktree --force

    - name: Fail if tests failed
      if: always()
      run: |
        rc=$(cat test_exit_code.txt 2>/dev/null || echo 1)
        echo "Test exit code: $rc"
        if [ "$rc" -ne 0 ]; then
          echo "Tests failed — failing workflow after badge update"
          exit 1
        else
          echo "All tests passed"
        fi
      shell: bash
